; Packaging filter for the DynamicRope plugin (read by UAT BuildPlugin).
;
; The default filter already includes only /Source, /Content, /Shaders, /Resources,
; /Binaries/ThirdParty and the generated /Intermediate/Build headers, so anything not
; listed there is left out of a packaged plugin. Additional includes, and exclusions
; restated so a later broad include rule cannot pull them in by mistake:
;
;   /README.md  Shipped with the package: the buyer's first entry point.
;   /Shaders    The plugin's .usf compute shaders. BuildPlugin already includes the
;               folder by default; restated here so the shipped filter documents every
;               custom folder present in the package (Fab review requirement).
;   /Docs       User documentation is hosted externally (product-page link), so the
;               source-tree copy is not shipped.
;   /Scripts    Editor-side authoring tooling (asset/material generators). Useful in
;               the source tree, of no use to someone consuming the packaged plugin.

[FilterPlugin]
/README.md
/Shaders/...
-/Docs/...
-/Scripts/...
