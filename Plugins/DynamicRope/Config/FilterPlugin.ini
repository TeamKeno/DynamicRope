; Packaging filter for the DynamicRope plugin (read by UAT BuildPlugin).
;
; The default filter already includes only /Source, /Content, /Shaders, /Resources,
; /Binaries/ThirdParty and the generated /Intermediate/Build headers, so anything not
; listed there is left out of a packaged plugin. The exclusions below restate that for
; the two directories where it is a deliberate decision rather than an accident, so a
; later broad include rule cannot pull them in by mistake.
;
;   /Docs      Design notes and proof-of-concept write-ups. Internal engineering
;              rationale, not user documentation, and still written in Korean.
;   /Scripts   Editor-side authoring tooling (asset/material generators). Useful in the
;              source tree, of no use to someone consuming the packaged plugin.

[FilterPlugin]
-/Docs/...
-/Scripts/...
