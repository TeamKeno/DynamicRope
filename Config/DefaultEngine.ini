

[Audio]
UseAudioMixer=True

; The path tracer (the offline-quality reference view mode) is not used by this project. Disabling it
; skips its 8 ray tracing pipeline (RTPSO) permutations, whose background compiles otherwise take
; 14-27s each and saturate the CPU workers for the first ~30s of every fresh game process.
[ConsoleVariables]
r.PathTracing=0

