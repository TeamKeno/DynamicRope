[CoreRedirects]
; Rename ERopePhase::Reel (the GuaranteedWrap 'loaded / ready-to-throw' state) to Loaded,
; resolving the name clash with rope-length reeling (ReelSpeed/ReelRate/ReelIn/ReelOut).
; Keeps existing Blueprints/assets working after the C++ rename (CL for Reel->Loaded).
+EnumRedirects=(Enum="/Script/DynamicRope.ERopePhase",ValueChanges=(("Reel","Loaded")))
+EnumRedirects=(Enum="/Script/DynamicRope.ERopeThrowRejectReason",ValueChanges=(("NotInReel","NotLoaded")))
+PropertyRedirects=(OldName="/Script/DynamicRope.RopeComponent.ReelHandSocket",NewName="/Script/DynamicRope.RopeComponent.LoadedHandSocket")
+PropertyRedirects=(OldName="/Script/DynamicRope.RopeComponent.bShowRopeInReel",NewName="/Script/DynamicRope.RopeComponent.bShowRopeWhenLoaded")
+FunctionRedirects=(OldName="/Script/DynamicRope.RopeComponent.EnterReel",NewName="/Script/DynamicRope.RopeComponent.EnterLoaded")
+FunctionRedirects=(OldName="/Script/DynamicRope.RopeComponent.SetShowRopeInReel",NewName="/Script/DynamicRope.RopeComponent.SetShowRopeWhenLoaded")
+FunctionRedirects=(OldName="/Script/DynamicRope.RopeComponent.ToggleShowRopeInReel",NewName="/Script/DynamicRope.RopeComponent.ToggleShowRopeWhenLoaded")
+FunctionRedirects=(OldName="/Script/DynamicRope.RopeComponent.IsShowRopeInReel",NewName="/Script/DynamicRope.RopeComponent.IsShowRopeWhenLoaded")
